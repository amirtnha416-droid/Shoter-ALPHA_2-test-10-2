name: Build ALPHA-X

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ALPHA-X
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build installer and portable EXE
        run: npm run build:windows
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: ALPHA-X-Windows
          path: ALPHA-X/release/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ALPHA-X
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare locally bundled game
        run: npm run prepare:game
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ALPHA-X-Android-APK
          path: ALPHA-X/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
